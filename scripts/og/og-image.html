<!doctype html>
<!--
  Source for artifacts/credlyr/public/og-image.jpg (1200×630), using the site's
  own painting and fonts. Regenerate after a headline or brand change:
    scripts/og/render.sh
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("../../artifacts/credlyr/public/fonts/inter-normal-latin.woff2") format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 200 800; src: url("../../artifacts/credlyr/public/fonts/plus-jakarta-sans-normal-latin.woff2") format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  .art { position: absolute; inset: 0 0 auto 0; height: 560px; background: url("../../artifacts/credlyr/public/art/valley-hero.jpg") 50% 30% / cover; }
  .fade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 44%, rgba(255,255,255,0.55) 60%, rgba(255,255,255,0.9) 74%, #fff 88%); }
  .logo { position: absolute; left: 58px; top: 50px; font: 500 30px/1 "Plus Jakarta Sans", sans-serif; letter-spacing: -0.035em; color: #111110; }
  .copy { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font-family: "Inter", sans-serif; }
  h1 { margin: 0 auto; max-width: 960px; font-weight: 400; font-size: 70px; line-height: 1.04; letter-spacing: -0.05em; color: #222221; }
  p { margin: 26px 0 0; font-size: 24px; letter-spacing: -0.02em; color: #5f5c58; }
</style>
</head>
<body>
  <div class="art"></div>
  <div class="fade"></div>
  <div class="logo">Olerivo</div>
  <div class="copy">
    <h1>Turn website visitors into booked consultations.</h1>
    <p>Websites with booking and follow-up for clinics, practices and advisory firms</p>
  </div>
</body>
</html>
